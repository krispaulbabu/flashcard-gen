[project]
name = "crema-backend"
version = "0.1.0"
description = "Local sidecar for Crema: reads documents and generates flashcards via OpenRouter."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "httpx>=0.27",
  "pydantic>=2.9",
  "pymupdf>=1.24,<2",
  "python-docx>=1.1",
  "ebooklib>=0.18",
  "beautifulsoup4>=4.12",
]

[dependency-groups]
dev = ["pytest>=8.3", "pyinstaller>=6.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["crema_backend"]
