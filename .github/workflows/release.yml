# Builds Retain for macOS (Apple Silicon and Intel). On a tag like v0.1.0 (which must match
# package.json's version), a final job puts every installer on one draft GitHub Release; publish
# it from the Releases page. Manual runs only build, and keep the installers as workflow artifacts.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows is off for now; uncomment to build it again.
          # - os: windows-latest # Windows x64
          - os: macos-latest # Apple Silicon
          - os: macos-15-intel # Intel Mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json version $version"
            exit 1
          fi

      - name: Freeze the Python backend
        working-directory: backend
        run: |
          uv sync --frozen
          uv run python build_backend.py

      - name: Install and build the app
        run: |
          npm ci
          npm run build

      - name: Package the installers
        run: npx electron-builder --publish never

      - name: Keep the installers as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: retain-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
          if-no-files-found: error

  # One job creates the release, so parallel builds can't each make their own draft.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la installers
          gh release create "$GITHUB_REF_NAME" installers/* \
            --repo "$GITHUB_REPOSITORY" --draft --title "Retain ${GITHUB_REF_NAME#v}" --generate-notes
